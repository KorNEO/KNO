---
layout: default
title: KNO
lang: en
alt_url: /
---
{%- comment -%}
  English home. Static UI text below is a DRAFT (terminology pass pending).
  The <script> block is intentionally still identical to the Korean home for now —
  its in-chart labels (topics, months, etc.) overlap with data.html terminology and
  will be unified in the terminology pass, ideally by extracting a shared include.
{%- endcomment -%}
{%- assign neo_total = 0 -%}
{%- for report in site.reports -%}
  {%- if report.neologism_count -%}
    {%- assign neo_total = neo_total | plus: report.neologism_count -%}
  {%- endif -%}
{%- endfor -%}

<div class="hero">
  <img src="{{ '/img/KNO.png' | relative_url }}" alt="KNO" class="hero-logo">
  <p class="hero-stat"><span class="fmt-num">{{ neo_total }}</span> neologisms observed since January 2025</p>
  <p class="hero-source">(based on first appearance in &lt;Naver News&gt;)</p>
</div>

<div class="section overview">
  <h2>KNO: Korean Neologism Observatory</h2>
  <p><strong>KNO</strong> is a system that collects newly emerging Korean words and phrases on a monthly basis, analyzes how they are used, and records the results.</p>
</div>

<div class="section">
  <h2>Most frequent neologisms <span class="hint-tip">Click a neologism to open its first-appearance article.</span></h2>
  <div id="featuredHighFreq" class="featured-neo">
    <div class="empty-state"><p>Loading data…</p></div>
  </div>
</div>

<div class="section">
  <h2>Most recent neologisms <span class="hint-tip">Click a neologism to open its first-appearance article.</span></h2>
  <div id="featuredRecent" class="featured-neo">
    <div class="empty-state"><p>Loading data…</p></div>
  </div>
</div>

<div class="section">
  <h2>Observer's pick <span class="hint-tip">Click a neologism to open its first-appearance article.</span></h2>
  <div id="featuredPick" class="featured-neo">
    <div class="empty-state"><p>Loading data…</p></div>
  </div>
</div>

<script>
const MONTHS = ['2025.01','2025.02','2025.03','2025.04','2025.05','2025.06','2025.07','2025.08','2025.09','2025.10','2025.11','2025.12'];
// SECTIONS: Korean keys used to look up d['주제별 상대빈도'][s]; SECTIONS_EN is display only.
const SECTIONS = ['정치','경제','사회','생활/문화','IT/과학','세계','연예','스포츠'];
const SECTIONS_EN = ['Politics','Economy','Society','Life & Culture','IT & Science','World','Entertainment','Sports'];
const pieColors = [
  'rgba(30,58,138,0.78)', 'rgba(37,99,235,0.72)', 'rgba(124,58,237,0.72)', 'rgba(14,116,144,0.72)',
  'rgba(194,65,12,0.72)', 'rgba(202,138,4,0.72)', 'rgba(15,118,110,0.72)', 'rgba(190,18,60,0.72)'
];

// 관측자 추천 신어 (수동 설정)
const OBSERVER_PICK = '디지털 월세';

fetch('../assets/data/neo_data_712.json')
  .then(r => r.json())
  .then(data => {
    const highFreq = [...data].sort((a, b) => b['단어빈도_전체'] - a['단어빈도_전체'])[0];
    const recent = [...data].sort((a, b) => new Date(b['최초 출현일']) - new Date(a['최초 출현일']))[0];
    const pick = data.find(d => d['표제어'] === OBSERVER_PICK) || data[0];
    [
      { id: 'featuredHighFreq', d: highFreq },
      { id: 'featuredRecent', d: recent },
      { id: 'featuredPick', d: pick },
    ].forEach(f => renderFeatured(f.id, f.d));
  })
  .catch(err => {
    console.error('Data load failed:', err);
  });

function renderFeatured(containerId, d) {
  const container = document.getElementById(containerId);
  const totalFreq = d['단어빈도_전체'];
  const monthlyFreq = d['월별 상대빈도'].map(v => Math.round(v));

  const maxVal = Math.max(...monthlyFreq);
  const maxIdx = monthlyFreq.indexOf(maxVal);
  const maxLabel = 'Peak (' + MONTHS[maxIdx] + '): <span style="color:#1e3a8a;font-weight:600">' + maxVal.toLocaleString() + '</span>';

  container.innerHTML = `
    <div class="featured-neo-header">
      <a href="${d['기사문 URL'] || '#'}" target="_blank" class="featured-neo-title">${d['표제어']}</a>
      <span class="featured-neo-meta">First attestation: ${d['최초 출현일']} · Total: ${totalFreq.toLocaleString()}</span>
    </div>
    <div class="featured-neo-charts">
      <div class="featured-chart-box" style="position:relative">
        <h4>Monthly RelFreq</h4>
        <div style="position:absolute;top:0.8rem;right:1rem;font-size:0.75rem;color:var(--text-secondary);text-align:right">${maxLabel}</div>
        <canvas id="${containerId}ChartTF"></canvas>
      </div>
      <div class="featured-chart-box">
        <h4>Distribution by text topic</h4>
        <canvas id="${containerId}ChartPMW"></canvas>
      </div>
    </div>
  `;

  // 월별 빈도 차트
  new Chart(document.getElementById(`${containerId}ChartTF`), {
    type: 'line',
    data: {
      labels: MONTHS,
      datasets: [{
        data: monthlyFreq,
        backgroundColor: 'rgba(30,58,138,0.10)',
        borderColor: '#1e3a8a',
        borderWidth: 2,
        pointBackgroundColor: '#1e3a8a',
        pointRadius: 3,
        tension: 0.3,
        fill: true,
      }]
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      interaction: { mode: 'index', intersect: false },
      plugins: {
        legend: { display: false },
        tooltip: {
          displayColors: false,
          bodyColor: '#fff',
          backgroundColor: 'rgba(26,37,64,0.92)',
          callbacks: {
            title: () => '',
            label: ctx => ctx.label + ': ' + ctx.raw.toLocaleString()
          }
        }
      },
      scales: {
        x: { ticks: { color: '#5a6478', font: { size: 10 }, maxRotation: 90, minRotation: 90 }, grid: { color: 'rgba(221,226,234,0.9)' } },
        y: { ticks: { color: '#5a6478', font: { size: 10 } }, grid: { color: 'rgba(221,226,234,0.9)' }, beginAtZero: true }
      }
    }
  });

  // 주제별 분포 차트
  const pmwData = SECTIONS.map(s => d['주제별 상대빈도'][s] || 0);
  const pmwTotal = pmwData.reduce((a, b) => a + b, 0);
  const isMobile = window.innerWidth <= 768;

  new Chart(document.getElementById(`${containerId}ChartPMW`), {
    type: 'doughnut',
    data: {
      labels: SECTIONS_EN,
      datasets: [{
        data: pmwData,
        backgroundColor: pieColors,
        borderColor: '#ffffff',
        borderWidth: 2,
      }]
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      layout: {
        padding: isMobile ? { left: 40, right: 40, top: 5, bottom: 0 } : { left: 0, right: 0 }
      },
      plugins: {
        legend: {
          position: isMobile ? 'bottom' : 'right',
          align: 'center',
          maxWidth: isMobile ? 280 : undefined,
          labels: {
            color: '#1a2540',
            font: { size: isMobile ? 10 : 11 },
            padding: isMobile ? 10 : 12,
            boxWidth: isMobile ? 10 : 12,
            usePointStyle: true,
          }
        },
        tooltip: {
          callbacks: {
            label: ctx => {
              const pct = pmwTotal > 0 ? ((ctx.raw / pmwTotal) * 100).toFixed(1) : 0;
              return ctx.label + ': ' + pct + '%';
            }
          }
        }
      }
    }
  });

}

document.querySelectorAll('.fmt-num').forEach(function(el) {
  var text = el.textContent.trim();
  var num = Number(text);
  if (!isNaN(num) && text !== '') {
    el.textContent = num.toLocaleString('en-US');
  }
});
</script>
