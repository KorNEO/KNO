title: KNO
description: Korean Neologism Observatory
url: "https://korneo.github.io"
baseurl: "/KNO"

markdown: kramdown
permalink: /reports/:year/:month/:title/

plugins:
  - jekyll-sitemap
  - jekyll-seo-tag

collections:
  reports:
    output: true
    sort_by: date
  reports_en:
    output: true
    sort_by: date

defaults:
  - scope:
      path: ""
      type: "reports"
    values:
      layout: "report"
      lang: "ko"
  - scope:
      path: ""
      type: "reports_en"
    values:
      layout: "report"
      lang: "en"

exclude:
  - README.md
  - README.ko.md
  - Gemfile
  - Gemfile.lock
  - LICENSE
